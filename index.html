<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slick Click: Search anything, from anywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #2B2B30; --paper: #F4F2EE; --accent: #839CFF; --slate: #5A5A60;
    --bg-0: #151518;
    --bg-1: #1a1a1d;
    --bg-2: #1d1d21;
    --bg-3: #26262b;
    --line: rgba(244,242,238,0.10);
    --line-2: rgba(244,242,238,0.18);
    --ink-0: #F4F2EE;
    --ink-1: #E4E2DE;
    --ink-2: #C4C2BE;
    --ink-3: #A19FA3;
    --blue: #839cff;
    --blue-bright: #839cff;
    --blue-soft: #839cff;
    --blue-deep: #839cff;
    --highlight: rgba(131,156,255,0.32);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --display: 'Archivo', 'Plus Jakarta Sans', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink-1);
    background: var(--bg-0);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  ::selection { background: var(--highlight); color: #F4F2EE; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  #root { min-height: 100vh; }

  /* Layout */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  /* Background scaffold */
  .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #151518; }

  /* Top nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); background: rgba(21,21,24, 0.55);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 32px; height: 32px; }
  .brand .word {
    font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: -0.01em;
    color: #F4F2EE;
  }
  .brand image-slot {
    cursor: pointer;
    border-radius: 8px;
    transition: box-shadow .15s, transform .15s;
  }
  .brand image-slot:hover {
    box-shadow: 0 0 0 2px rgba(131,156,255,0.4), 0 8px 20px -8px rgba(131,156,255,0.5);
    transform: translateY(-1px);
  }
  .logo-uploader {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s, background .15s;
    flex-shrink: 0;
  }
  .logo-uploader:hover {
    background: rgba(131,156,255,0.10);
    box-shadow: 0 0 0 2px rgba(131,156,255,0.45), 0 8px 20px -8px rgba(131,156,255,0.5);
    transform: translateY(-1px);
  }
  .logo-uploader.drag-over {
    background: rgba(131,156,255,0.22);
    box-shadow: 0 0 0 2px var(--blue-soft), 0 0 24px rgba(131,156,255,0.5);
  }
  .logo-uploader .lu-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(21,21,24,0.72);
    color: #F4F2EE;
    border-radius: 9px;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .logo-uploader:hover .lu-overlay,
  .logo-uploader.drag-over .lu-overlay { opacity: 1; }
  .logo-uploader .lu-clear {
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #ef4444;
    color: #F4F2EE;
    font-size: 14px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity .15s, transform .15s;
    cursor: pointer;
    border: 0;
  }
  .logo-uploader:hover .lu-clear { opacity: 1; }
  .logo-uploader .lu-clear:hover { transform: scale(1.1); }
  .brand-hint {
    display: inline-flex; align-items: center; gap: 5px;
    margin-left: 4px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(131,156,255,0.10);
    border: 1px dashed rgba(131,156,255,0.45);
    color: var(--blue-soft);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.02em;
    opacity: 0.85;
    transition: opacity .15s, background .15s;
    cursor: help;
  }
  .brand:hover .brand-hint { opacity: 1; background: rgba(131,156,255,0.18); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 14.5px; color: var(--ink-2); font-weight: 500;
    transition: color .15s;
  }
  .nav-links a:hover, .nav-links a[aria-current="page"] { color: #F4F2EE; }
  .nav-cta { white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px;
    background: #F4F2EE; color: #1a1a1d; font-weight: 700; font-size: 14px;
    transition: transform .15s, box-shadow .15s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -10px rgba(244,242,238,0.4); }

  /* Hero */
  .hero { padding: 110px 0 60px; text-align: center; position: relative; }
  .hero .eyebrow {
    display: inline-flex; align-items: center;
    padding: 10px 22px; border-radius: 999px;
    border: 0;
    background: #F4F2EE;
    box-shadow: 0 10px 30px -8px rgba(131,156,255,0.6);
    color: #151518;
    font-size: 13px; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .hero .eyebrow .dot { display: none; }
  .hero h1 {
    font-size: clamp(48px, 7.5vw, 104px);
    line-height: 1.02; letter-spacing: -0.035em;
    font-weight: 800; color: #F4F2EE;
    margin: 28px 0 0;
  }
  .hero h1 .blue { color: var(--blue-bright); }
  .hero h1 .zoom-in-left {
    display: inline-block;
    transform-origin: left center;
    animation: zoomInLeft 0.75s ease-out both;
  }
  @keyframes zoomInLeft {
    0% {
      opacity: 0;
      transform: translateX(-120vw) scale(0.25);
    }
    50% { opacity: 1; }
    /* arrives */
    55% { transform: translateX(0) scale(1); }
    /* bounce 1 (largest) */
    68% { transform: translateX(22px) scale(1); }
    /* bounce 2 (shorter) */
    82% { transform: translateX(-10px) scale(1); }
    /* bounce 3 (shortest) */
    92% { transform: translateX(4px) scale(1); }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }
  .hero h1 .zoom-in-right {
    display: inline-block;
    transform-origin: right center;
    /* 0.75s anim + 1s pause after first line finishes = 1.75s delay */
    animation: zoomInRight 0.75s ease-out 1.75s both;
  }
  @keyframes zoomInRight {
    0% {
      opacity: 0;
      transform: translateX(120vw) scale(0.25);
    }
    50% { opacity: 1; }
    /* arrives */
    55% { transform: translateX(0) scale(1); }
    /* bounce 1 (largest) */
    68% { transform: translateX(-22px) scale(1); }
    /* bounce 2 (shorter) */
    82% { transform: translateX(10px) scale(1); }
    /* bounce 3 (shortest) */
    92% { transform: translateX(-4px) scale(1); }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }
  .hero p.lead {
    margin: 28px auto 0; max-width: 640px;
    font-size: 19px; line-height: 1.55; color: var(--ink-2);
  }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .btn { white-space: nowrap;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px; border-radius: 999px; font-weight: 700; font-size: 15px;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn-primary {
    background: linear-gradient(180deg, #839cff 0%, #839cff 100%);
    color: var(--ink);
    box-shadow: 0 10px 30px -10px rgba(131,156,255,0.7), inset 0 1px 0 rgba(244,242,238,0.25);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(131,156,255,0.8), inset 0 1px 0 rgba(244,242,238,0.25); }
  .btn-ghost {
    background: rgba(244,242,238,0.06);
    color: #F4F2EE;
    border: 1px solid var(--line-2);
  }
  .btn-ghost:hover { background: rgba(244,242,238,0.10); }
  .meta-row {
    margin-top: 22px; display: flex; gap: 22px; justify-content: center;
    color: var(--ink-3); font-size: 13px; flex-wrap: wrap;
  }
  .meta-row span { display: inline-flex; align-items: center; gap: 6px; }

  /* Section header */
  .section { padding: 100px 0; position: relative; }
  .section-head { text-align: center; margin-bottom: 56px; }
  .section-head .kicker, .stats-lead .kicker {
    color: var(--blue-soft); font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .section-head h2 {
    margin: 14px 0 0;
    font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05;
    letter-spacing: -0.025em; color: #F4F2EE; font-weight: 800;
  }
  .section-head p {
    margin: 18px auto 0; max-width: 620px; color: var(--ink-2); font-size: 17px; line-height: 1.55;
  }

  /* DEMO panel */
  .demo-shell {
    --grow: 0;
    width: calc(55% + 45% * var(--grow));
    max-width: 1180px;
    margin-inline: auto;
    will-change: width;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(244,242,238,0.04), rgba(244,242,238,0.01));
    border: 1px solid var(--line-2);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(244,242,238,0.06);
    overflow: hidden;
  }
  .browser-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.22);
  }
  .traffic { display: flex; gap: 7px; }
  .traffic span { width: 11px; height: 11px; border-radius: 50%; }
  .traffic span:nth-child(1) { background: #ff5f57; }
  .traffic span:nth-child(2) { background: #febc2e; }
  .traffic span:nth-child(3) { background: #28c840; }
  .url-bar {
    flex: 1; height: 30px; border-radius: 8px;
    background: rgba(244,242,238,0.06);
    border: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    color: var(--ink-2); font-size: 12.5px;
    font-family: var(--mono);
  }
  .url-bar .lock { color: var(--blue-soft); }
  .ext-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(131,156,255,0.18);
    border: 1px solid rgba(131,156,255,0.4);
    font-size: 11px; font-weight: 700; color: var(--blue-soft);
  }
  .article {
    padding: 44px 56px 56px;
    background:
      radial-gradient(600px 300px at 80% 0%, rgba(131,156,255,0.10), transparent 70%),
      #1d1d21;
    color: var(--ink-1);
    line-height: 1.7; font-size: 16.5px;
    min-height: 420px;
    position: relative;
    user-select: text;
  }
  .article h3 {
    font-size: 28px; letter-spacing: -0.02em; color: #F4F2EE;
    margin: 0 0 6px; font-weight: 700;
  }
  .article .byline {
    color: var(--ink-3); font-size: 13px; margin-bottom: 22px;
  }
  .article p { margin: 0 0 16px; }
  .article p::selection,
  .article h3::selection { background: var(--highlight); color: #F4F2EE; }
  .compat-section h2 {
    font-family: var(--font);
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--ink-0);
    margin: 0 0 16px;
  }
  .compat-section p {
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.65;
    color: var(--ink-2);
    max-width: 560px;
    margin: 0 auto;
  }
  /* COMPATIBILITY STRIP */
  .compat-section {
    padding: 80px 0 60px;
    overflow: hidden;
  }
  .compat-split { display: flex; align-items: center; max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  .compat-card { flex: 0 1 460px; text-align: left; }
  .compat-link { flex: 1 1 60px; min-width: 48px; height: 1px; background: var(--line-2); position: relative; }
  .compat-stage { flex: 0 0 auto; display: flex; gap: 14px; border-left: 1px solid var(--line-2); padding: 4px 0 4px 28px; }
  .compat-track { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .compat-chip { min-width: 250px; }
  @media (max-width: 880px) { .compat-stage { flex-direction: column; } .compat-split { flex-direction: column; align-items: stretch; gap: 28px; } .compat-link { display: none; } .compat-stage { border-left: 0; padding: 0; } .compat-chip { min-width: 0; } }
  .compat-track { perspective: 700px; }
  .compat-chip { position: relative; transform-origin: 50% 0; backface-visibility: hidden; }
  .compat-idle .compat-chip { opacity: 0; transform: rotateX(-90deg); }
  
  .compat-in .compat-chip { animation: pillFlip .18s ease-out both; animation-delay: calc(var(--k) * .08s); transform-origin: 50% 0; }
  
  
  @keyframes pillFlipOut { from { transform: rotateX(0); opacity: 1; } to { transform: rotateX(-90deg); opacity: .2; } }
  @keyframes pillFlip { from { transform: rotateX(-90deg); opacity: .2; } to { transform: rotateX(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .compat-in .compat-chip, .compat-out .compat-chip { animation: none; opacity: 1; transform: none; } .compat-idle .compat-chip { opacity: 1; transform: none; } }
  .compat-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 40px;
    background: rgba(244,242,238,0.05);
    border: 1px solid rgba(244,242,238,0.09);
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .compat-chip:hover {
    background: rgba(131,156,255,0.10);
    color: var(--ink-1);
  }

  /* DEMO video (replaces interactive article) */
  .demo-video {
    aspect-ratio: 16 / 9;
    background: #1d1d21;
    display: flex;
    width: 100%;
  }
  .demo-video-el {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #1d1d21;
  }
  .video-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--ink-3);
    background:
      radial-gradient(600px 300px at 80% 0%, rgba(131,156,255,0.10), transparent 70%),
      repeating-linear-gradient(135deg, rgba(244,242,238,0.025) 0 14px, transparent 14px 28px),
      #1d1d21;
  }
  .video-placeholder .vp-play {
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 22px; color: var(--blue-soft);
    background: rgba(131,156,255,0.14);
    border: 1px solid rgba(131,156,255,0.4);
    padding-left: 4px;
  }
  .video-placeholder .vp-label {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-2);
  }
  .video-placeholder .vp-hint {
    font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  }
  .video-placeholder .vp-hint code {
    color: var(--blue-soft);
    background: rgba(131,156,255,0.12);
    padding: 2px 6px; border-radius: 5px;
  }
  .hint-pill {
    position: absolute; top: 18px; right: 18px;
    display: inline-flex; gap: 8px; align-items: center;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.4); border: 1px dashed rgba(131,156,255,0.5);
    color: var(--blue-soft); font-size: 12px; font-weight: 600;
  }
  /* Floating popup that appears after selection */
  .swift-popup {
    position: absolute; z-index: 30;
    background: #0e1840;
    border: 1px solid rgba(131,156,255,0.5);
    border-radius: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 4px rgba(131,156,255,0.08);
    padding: 10px;
    min-width: 260px;
    animation: popIn .18s ease-out;
    transform-origin: top left;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(-4px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .swift-popup .pop-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px 10px;
    color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .swift-popup .pop-head .q {
    color: #F4F2EE; font-weight: 700; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px;
  }
  .swift-popup .engines { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .swift-popup .engine {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px;
    transition: background .12s;
    text-align: left;
  }
  .swift-popup .engine:hover { background: rgba(131,156,255,0.18); }
  .swift-popup .engine .ico {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 11px;
    color: #F4F2EE;
    flex-shrink: 0;
  }
  .swift-popup .engine .name {
    font-size: 13px; color: #F4F2EE; font-weight: 600;
  }
  .swift-popup .pop-foot {
    margin-top: 6px; padding: 8px 8px 4px;
    color: var(--ink-3); font-size: 11px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line);
  }
  .kbd {
    display: inline-flex; align-items: center; padding: 1px 6px;
    border: 1px solid var(--line-2); border-radius: 5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    background: rgba(244,242,238,0.04);
  }

  /* Result tabs */
  .result-overlay {
    position: absolute; inset: 0;
    background: rgba(21,21,24,0.85);
    backdrop-filter: blur(8px);
    display: flex; flex-direction: column;
    animation: fadeIn .25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .result-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.3);
  }
  .result-head .close {
    margin-left: auto; padding: 6px 10px; border-radius: 8px;
    background: rgba(244,242,238,0.06); color: #F4F2EE; font-size: 12px; font-weight: 600;
  }
  .result-head .close:hover { background: rgba(244,242,238,0.12); }
  .result-body { padding: 28px 32px; overflow: auto; }
  .result-tile {
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 12px;
    background: rgba(244,242,238,0.02);
    transition: border-color .15s, background .15s;
  }
  .result-tile:hover { border-color: var(--line-2); background: rgba(244,242,238,0.04); }
  .result-tile .rt-url { color: var(--blue-soft); font-size: 12px; font-family: var(--mono); }
  .result-tile .rt-title { color: #F4F2EE; font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
  .result-tile .rt-snippet { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }

  /* the stats read as a quiet footnote to the three steps, not a second section */
  .stats-block {
    margin-top: 56px; padding-top: 40px;
    border-top: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: center;
    gap: 40px; flex-wrap: wrap;
  }
  .stats-lead { font-size: 18px; color: var(--ink-3); margin: 0; }
  .stats-block .stats {
    display: flex; gap: 56px; background: none; border: none;
    border-radius: 0; overflow: visible; flex-wrap: wrap;
  }

  /* Feature grid */
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .feature-groups { display: grid; gap: 46px; }
  .feature-group { display: grid; gap: 0; }
  .group-label {
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--blue-soft);
  }
  .group-label::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
