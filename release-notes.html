<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Release Notes | Slick Click</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #151518;
    --bg-1: #1a1a1d;
    --bg-2: #1d1d21;
    --bg-3: #26262b;
    --line: rgba(244,242,238,0.08);
    --line-2: rgba(244,242,238,0.14);
    --ink-0:#F4F2EE;
    --ink-1:#E4E2DE;
    --ink-2:#C4C2BE;
    --ink-3:#A19FA3;
    --blue: #839cff;
    --blue-bright: #9fb1ff;
    --blue-soft: #839cff;
    --blue-deep: #6a82e8;
    --highlight: rgba(131,156,255,0.32);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink-1);
    background: var(--bg-0);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  ::selection { background: var(--highlight); color: #F4F2EE; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  #root { min-height: 100vh; }

  /* Layout */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  /* Background scaffold */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: #151518;
  }

  /* Top nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: rgba(21,21,24, 0.55);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 68px; gap: 20px; padding-top: 10px; padding-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 32px; height: 32px; }
  .brand .word {
    font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: -0.01em;
    color: #F4F2EE;
  }
  .brand image-slot {
    cursor: pointer;
    border-radius: 8px;
    transition: box-shadow .15s, transform .15s;
  }
  .brand image-slot:hover {
    box-shadow: 0 0 0 2px rgba(131,156,255,0.4), 0 8px 20px -8px rgba(131,156,255,0.5);
    transform: translateY(-1px);
  }
  .logo-uploader {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s, background .15s;
    flex-shrink: 0;
  }
  .logo-uploader:hover {
    background: rgba(131,156,255,0.10);
    box-shadow: 0 0 0 2px rgba(131,156,255,0.45), 0 8px 20px -8px rgba(131,156,255,0.5);
    transform: translateY(-1px);
  }
  .logo-uploader.drag-over {
    background: rgba(131,156,255,0.22);
    box-shadow: 0 0 0 2px var(--blue-soft), 0 0 24px rgba(131,156,255,0.5);
  }
  .logo-uploader .lu-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(21,21,24,0.72);
    color: #F4F2EE;
    border-radius: 9px;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .logo-uploader:hover .lu-overlay,
  .logo-uploader.drag-over .lu-overlay { opacity: 1; }
  .logo-uploader .lu-clear {
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #ef4444;
    color: #F4F2EE;
    font-size: 14px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity .15s, transform .15s;
    cursor: pointer;
    border: 0;
  }
  .logo-uploader:hover .lu-clear { opacity: 1; }
  .logo-uploader .lu-clear:hover { transform: scale(1.1); }
  .brand-hint {
    display: inline-flex; align-items: center; gap: 5px;
    margin-left: 4px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(131,156,255,0.10);
    border: 1px dashed rgba(131,156,255,0.45);
    color: var(--blue-soft);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.02em;
    opacity: 0.85;
    transition: opacity .15s, background .15s;
    cursor: help;
  }
  .brand:hover .brand-hint { opacity: 1; background: rgba(131,156,255,0.18); }
  .nav-links { display: flex; gap: 22px; flex-wrap: nowrap; }
  .nav-links a {
    white-space: nowrap;
    font-size: 14.5px; color: var(--ink-2); font-weight: 500;
    transition: color .15s;
  }
  .nav-links a:hover { color: #F4F2EE; }
  .nav-cta { white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px;
    background: #F4F2EE; color: #1a1a1d; font-weight: 700; font-size: 14px;
    transition: transform .15s, box-shadow .15s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -10px rgba(244,242,238,0.4); }

  /* Hero */
  .hero { padding: 110px 0 60px; text-align: center; position: relative; }
  .hero .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(131,156,255,0.45);
    background: rgba(131,156,255,0.10);
    color: var(--blue-soft);
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .hero .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--blue-soft);
    box-shadow: 0 0 12px var(--blue-soft);
  }
  .hero h1 {
    font-size: clamp(48px, 7.5vw, 104px);
    line-height: 1.02; letter-spacing: -0.035em;
    font-weight: 800; color: #F4F2EE;
    margin: 28px 0 0;
  }
  .hero h1 .blue { color: var(--blue-bright); }
  .hero p.lead {
    margin: 28px auto 0; max-width: 640px;
    font-size: 19px; line-height: 1.55; color: var(--ink-2);
  }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .btn { white-space: nowrap;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px; border-radius: 999px; font-weight: 700; font-size: 15px;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn-primary {
    background: linear-gradient(180deg, #839cff 0%, #839cff 100%);
    color: #F4F2EE;
    box-shadow: 0 10px 30px -10px rgba(131,156,255,0.7), inset 0 1px 0 rgba(244,242,238,0.25);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(131,156,255,0.8), inset 0 1px 0 rgba(244,242,238,0.25); }
  .btn-ghost {
    background: rgba(244,242,238,0.06);
    color: #F4F2EE;
    border: 1px solid var(--line-2);
  }
  .btn-ghost:hover { background: rgba(244,242,238,0.10); }
  .meta-row {
    margin-top: 22px; display: flex; gap: 22px; justify-content: center;
    color: var(--ink-3); font-size: 13px; flex-wrap: wrap;
  }
  .meta-row span { display: inline-flex; align-items: center; gap: 6px; }

  /* Section header */
  .section { padding: 100px 0; position: relative; }
  .section-head { text-align: center; margin-bottom: 56px; }
  .section-head .kicker {
    color: var(--blue-soft); font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .section-head h2 {
    margin: 14px 0 0;
    font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05;
    letter-spacing: -0.025em; color: #F4F2EE; font-weight: 800;
  }
  .section-head p {
    margin: 18px auto 0; max-width: 620px; color: var(--ink-2); font-size: 17px; line-height: 1.55;
  }

  /* DEMO panel */
  .demo-shell {
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(244,242,238,0.04), rgba(244,242,238,0.01));
    border: 1px solid var(--line-2);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(244,242,238,0.06);
    overflow: hidden;
  }
  .browser-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.22);
  }
  .traffic { display: flex; gap: 7px; }
  .traffic span { width: 11px; height: 11px; border-radius: 50%; }
  .traffic span:nth-child(1) { background: #ff5f57; }
  .traffic span:nth-child(2) { background: #febc2e; }
  .traffic span:nth-child(3) { background: #28c840; }
  .url-bar {
    flex: 1; height: 30px; border-radius: 8px;
    background: rgba(244,242,238,0.06);
    border: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    color: var(--ink-2); font-size: 12.5px;
    font-family: var(--mono);
  }
  .url-bar .lock { color: var(--blue-soft); }
  .ext-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(131,156,255,0.18);
    border: 1px solid rgba(131,156,255,0.4);
    font-size: 11px; font-weight: 700; color: var(--blue-soft);
  }
  .article {
    padding: 44px 56px 56px;
    background:
      radial-gradient(600px 300px at 80% 0%, rgba(131,156,255,0.10), transparent 70%),
      #1a1a1d;
    color: var(--ink-1);
    line-height: 1.7; font-size: 16.5px;
    min-height: 420px;
    position: relative;
    user-select: text;
  }
  .article h3 {
    font-size: 28px; letter-spacing: -0.02em; color: #F4F2EE;
    margin: 0 0 6px; font-weight: 700;
  }
  .article .byline {
    color: var(--ink-3); font-size: 13px; margin-bottom: 22px;
  }
  .article p { margin: 0 0 16px; }
  .article p::selection,
  .article h3::selection { background: var(--highlight); color: #F4F2EE; }
  .hint-pill {
    position: absolute; top: 18px; right: 18px;
    display: inline-flex; gap: 8px; align-items: center;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.4); border: 1px dashed rgba(131,156,255,0.5);
    color: var(--blue-soft); font-size: 12px; font-weight: 600;
  }
  /* Floating popup that appears after selection */
  .swift-popup {
    position: absolute; z-index: 30;
    background: #0e1840;
    border: 1px solid rgba(131,156,255,0.5);
    border-radius: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 4px rgba(131,156,255,0.08);
    padding: 10px;
    min-width: 260px;
    animation: popIn .18s ease-out;
    transform-origin: top left;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(-4px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .swift-popup .pop-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px 10px;
    color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .swift-popup .pop-head .q {
    color: #F4F2EE; font-weight: 700; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px;
  }
  .swift-popup .engines { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .swift-popup .engine {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px;
    transition: background .12s;
    text-align: left;
  }
  .swift-popup .engine:hover { background: rgba(131,156,255,0.18); }
  .swift-popup .engine .ico {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 11px;
    color: #F4F2EE;
    flex-shrink: 0;
  }
  .swift-popup .engine .name {
    font-size: 13px; color: #F4F2EE; font-weight: 600;
  }
  .swift-popup .pop-foot {
    margin-top: 6px; padding: 8px 8px 4px;
    color: var(--ink-3); font-size: 11px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line);
  }
  .kbd {
    display: inline-flex; align-items: center; padding: 1px 6px;
    border: 1px solid var(--line-2); border-radius: 5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    background: rgba(244,242,238,0.04);
  }

  /* Result tabs */
  .result-overlay {
    position: absolute; inset: 0;
    background: rgba(21,21,24,0.85);
    backdrop-filter: blur(8px);
    display: flex; flex-direction: column;
    animation: fadeIn .25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .result-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.3);
  }
  .result-head .close {
    margin-left: auto; padding: 6px 10px; border-radius: 8px;
    background: rgba(244,242,238,0.06); color: #F4F2EE; font-size: 12px; font-weight: 600;
  }
  .result-head .close:hover { background: rgba(244,242,238,0.12); }
  .result-body { padding: 28px 32px; overflow: auto; }
  .result-tile {
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 12px;
    background: rgba(244,242,238,0.02);
    transition: border-color .15s, background .15s;
  }
  .result-tile:hover { border-color: var(--line-2); background: rgba(244,242,238,0.04); }
  .result-tile .rt-url { color: var(--blue-soft); font-size: 12px; font-family: var(--mono); }
  .result-tile .rt-title { color: #F4F2EE; font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
  .result-tile .rt-snippet { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }

  /* Feature grid */
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .feature {
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(244,242,238,0.04), rgba(244,242,238,0.01));
    padding: 28px;
    border-radius: 18px;
    transition: border-color .2s, transform .2s;
  }
  .feature:hover { border-color: rgba(131,156,255,0.35); transform: translateY(-3px); }
  .feature .ico {
    width: 42px; height: 42px; border-radius: 11px;
    background: linear-gradient(180deg, rgba(131,156,255,0.25), rgba(131,156,255,0.1));
    border: 1px solid rgba(131,156,255,0.35);
    display: grid; place-items: center;
    color: var(--blue-soft);
    margin-bottom: 18px;
  }
  .feature h4 { margin: 0 0 8px; font-size: 18px; color: #F4F2EE; font-weight: 700; letter-spacing: -0.01em; }
  .feature p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .step {
    padding: 28px; border-radius: 18px;
    border: 1px solid var(--line);
    background: rgba(244,242,238,0.02);
    position: relative;
  }
  .step .num {
    font-family: var(--mono); font-size: 12px; color: var(--blue-soft);
    letter-spacing: 0.1em;
  }
  .step h4 { color: #F4F2EE; font-size: 22px; margin: 8px 0 10px; letter-spacing: -0.015em; }
  .step p { color: var(--ink-2); margin: 0; line-height: 1.55; }

  /* Engines / customization */
  .engines-shell {
    display: grid; grid-template-columns: 1.55fr 1fr; gap: 24px;
    align-items: stretch;
  }
  .engines-list, .engines-preview {
    border: 1px solid var(--line);
    background: rgba(244,242,238,0.02);
    border-radius: 18px;
    padding: 22px;
  }
  .engines-list {
    border: none;
    background: transparent;
    padding: 0;
    overflow: hidden;
  }
  .engines-list h5, .engines-preview h5 {
    margin: 0 0 4px; color: #F4F2EE; font-size: 16px; font-weight: 700;
  }
  .engines-list .hint, .engines-preview .hint {
    color: var(--ink-3); font-size: 13px; margin-bottom: 18px;
  }
  .engine-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(244,242,238,0.03);
    border: 1px solid var(--line);
    transition: background .15s, border-color .15s;
  }
  .engine-row.on { border-color: rgba(131,156,255,0.4); background: rgba(131,156,255,0.10); }
  .engine-row .grab { color: var(--ink-3); cursor: grab; }
  .engine-row .ico {
    width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
    font-weight: 800; font-size: 12px; color: #F4F2EE;
  }
  .engine-row .label { flex: 1; color: #F4F2EE; font-size: 14px; font-weight: 600; }
  .engine-row .url { color: var(--ink-3); font-size: 11.5px; font-family: var(--mono); }
  /* Toggle */
  .switch {
    width: 38px; height: 22px; border-radius: 999px;
    background: rgba(244,242,238,0.12); position: relative; transition: background .2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #F4F2EE;
    transition: transform .2s;
  }
  .switch.on { background: var(--blue); }
  .switch.on::after { transform: translateX(16px); }

  /* Shortcut playground */
  .shortcut-card {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(131,156,255,0.06), rgba(244,242,238,0.01));
    padding: 36px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center;
  }
  .shortcut-card .copy h3 { margin: 0 0 12px; color: #F4F2EE; font-size: 28px; letter-spacing: -0.02em; }
  .shortcut-card .copy p { color: var(--ink-2); line-height: 1.6; font-size: 15.5px; }
  .keys { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .key {
    padding: 12px 18px; border-radius: 12px;
    background: rgba(244,242,238,0.06);
    border: 1px solid var(--line-2);
    color: #F4F2EE; font-family: var(--mono); font-size: 14px; font-weight: 600;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3);
    transition: transform .12s, background .12s, border-color .12s;
  }
  .key.pressed {
    background: var(--blue);
    border-color: var(--blue-soft);
    transform: translateY(2px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2), 0 0 24px rgba(131,156,255,0.5);
  }
  .key-input {
    width: 100%; padding: 14px 18px;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--line-2);
    color: #F4F2EE; font-family: var(--mono); font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .key-input:focus { border-color: var(--blue-soft); }

  /* Testimonials */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .review {
    padding: 26px; border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(244,242,238,0.02);
  }
  .review .stars { color: #fdba74; letter-spacing: 2px; font-size: 14px; }
  .review p {
    margin: 12px 0 16px; color: var(--ink-1); font-size: 15px; line-height: 1.55;
  }
  .review .author {
    display: flex; align-items: center; gap: 10px;
  }
  .review .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    color: #F4F2EE; font-weight: 700; font-size: 12px;
  }
  .review .who { font-size: 13px; color: var(--ink-2); }
  .review .who strong { color: #F4F2EE; display: block; }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--line);
    border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line);
  }
  .stat {
    padding: 28px; background: #1a1a1d;
    text-align: center;
  }
  .stat .n {
    font-size: 40px; font-weight: 800; color: #F4F2EE; letter-spacing: -0.03em;
    font-feature-settings: 'tnum';
  }
  .stat .l { color: var(--ink-3); font-size: 13px; margin-top: 4px; }

  /* FAQ */
